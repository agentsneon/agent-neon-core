# Neon Core Configuration
project:
  name: NeonCore
  version: 0.1.0

agent:
  name: Neon
  role: persistent_digital_agent
  persistence: true

models:
  default: cloud
  providers:
    local:
      type: llama.cpp
      path: /path/to/llama
    cloud:
      type: gemini
      model: gemini-2.5-flash

memory:
  short_term_limit: 100
  long_term_enabled: true
  cleanup_interval: 3600

storage:
  path: ./data
